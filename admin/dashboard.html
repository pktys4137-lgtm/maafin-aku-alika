<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12141c">
  <meta name="robots" content="noindex, nofollow">
  <title>Jawaban masuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin-assets/css/admin.css">
</head>
<body>
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div>
        <h1>Jawaban masuk</h1>
        <p class="header-subtitle">Hanya jawaban dan waktu pengirimannya.</p>
      </div>
      <div class="header-actions">
        <button id="refresh-button" class="button" type="button">Muat ulang</button>
        <button id="logout-button" class="button danger" type="button">Keluar</button>
      </div>
    </header>

    <section aria-label="Ringkasan">
      <div class="stats-grid">
        <article class="stat-card">
          <span>Total jawaban</span>
          <strong id="stat-total">–</strong>
        </article>
        <article class="stat-card is-forgiven">
          <span>Sudah maafin</span>
          <strong id="stat-forgiven">–</strong>
        </article>
        <article class="stat-card is-waiting">
          <span>Belum bisa maafin</span>
          <strong id="stat-not-forgiven">–</strong>
        </article>
      </div>
      <div class="split-bar" id="split-bar" aria-hidden="true">
        <i class="bar-forgiven" style="width:0"></i>
        <i class="bar-waiting" style="width:0"></i>
      </div>
    </section>

    <section class="responses-card">
      <div class="section-heading">
        <h2>Riwayat</h2>
        <span id="last-updated" class="last-updated"></span>
      </div>

      <div id="dashboard-status" class="dashboard-status" role="status" aria-live="polite"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Waktu</th>
              <th scope="col">Jawaban</th>
            </tr>
          </thead>
          <tbody id="responses-body">
            <tr>
              <td colspan="2" class="empty-state">Memuat jawaban...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <a class="back-link dashboard-back" href="/">Buka halaman utama</a>
  </main>

  <script src="/admin-assets/js/admin.js" defer></script>
</body>
</html>
