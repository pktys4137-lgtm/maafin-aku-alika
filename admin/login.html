<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12141c">
  <meta name="robots" content="noindex, nofollow">
  <title>Masuk admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin-assets/css/admin.css">
</head>
<body class="admin-auth">
  <main class="auth-card">
    <h1>Masuk</h1>
    <p class="auth-subtitle">Lihat jawaban yang masuk dari halaman utama.</p>

    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="100" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>

      <button id="login-button" type="submit">Masuk</button>
      <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="/">Kembali ke halaman utama</a>
  </main>

  <script src="/admin-assets/js/admin.js" defer></script>
</body>
</html>
